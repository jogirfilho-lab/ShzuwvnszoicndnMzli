name: inject chz - sem API
'on':
  push:
    branches:
    - inject-chz-sem-api
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Extract original project
      shell: bash
      run: 'set -euo pipefail

        rm -rf source build dist

        mkdir -p source build dist

        tar -xzf 3105-1.1.1-original.tar.gz -C source

        PROJECT=source/3105-1.1.1/ThreeOneOSFive.xcodeproj

        echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

        '
    - name: Configure local-only version without API
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/apply_api_free.py source/3105-1.1.1/ThreeOneOSFive

        '
    - name: Build IPA without backend integration
      shell: bash
      run: "set -euo pipefail\nPROJECT=$(find source -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit)\ntest -n \"$PROJECT\"\necho \"Using project: $PROJECT\"\nSCHEME=$(xcodebuild -list -json -project \"$PROJECT\" | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"project\"][\"schemes\"][0])')\nxcodebuild -project \"$PROJECT\" -scheme \"$SCHEME\" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath \"$PWD/build/inject-chz-sem-api.xcarchive\" archive LIBRARY_SEARCH_PATHS=\"$PWD/source/3105-1.1.1/ThreeOneOSFive/SDK\" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION=2026.10.07 CURRENT_PROJECT_VERSION=\"20261015.${GITHUB_RUN_NUMBER}\" SWIFT_OPTIMIZATION_LEVEL=-O STRIP_INSTALLED_PRODUCT=YES COPY_PHASE_STRIP=YES DEAD_CODE_STRIPPING=YES GCC_GENERATE_DEBUGGING_SYMBOLS=NO\nAPP=$(find build/inject-chz-sem-api.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)\ntest -n \"$APP\"\nif find \"$APP\" -type f -name\
        \ '*.dylib' -print -quit | grep -q .; then\n  echo 'Unauthorized standalone dylib found in app bundle'\n  find \"$APP\" -type f -name '*.dylib' -print\n  exit 1\nfi\nif find \"$APP\" -type d -path '*/Framework' -print -quit | grep -q .; then\n  echo 'Unauthorized singular Framework directory found in app bundle'\n  find \"$APP\" -type d -path '*/Framework' -print\n  exit 1\nfi\nmkdir -p build/Payload\ncp -R \"$APP\" build/Payload/\n(cd build && zip -qry \"$GITHUB_WORKSPACE/dist/inject-chz-sem-api.ipa\" Payload)\ncp -R build/inject-chz-sem-api.xcarchive dist/\ntest -s dist/inject-chz-sem-api.ipa\n"
    - uses: actions/upload-artifact@v4
      with:
        name: inject-chz-sem-api
        path: dist/inject-chz-sem-api.ipa
        if-no-files-found: error
