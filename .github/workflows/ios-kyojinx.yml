      - name: Build original archive and IPA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find source -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit)
          test -n "$PROJECT"
          echo "Using project: $PROJECT"
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/nubank-preloaded-cards.xcarchive" archive LIBRARY_SEARCH_PATHS="$PWD/source/3105-1.1.1/ThreeOneOSFive/SDK" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION=2026.10.07 CURRENT_PROJECT_VERSION=20261007 SWIFT_OPTIMIZATION_LEVEL=-O STRIP_INSTALLED_PRODUCT=YES COPY_PHASE_STRIP=YES DEAD_CODE_STRIPPING=YES GCC_GENERATE_DEBUGGING_SYMBOLS=NO
          APP=$(find build/nubank-preloaded-cards.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          if find "$APP" -type f -name '*.dylib' -print -quit | grep -q .; then
            echo 'Unauthorized standalone dylib found in app bundle'
            find "$APP" -type f -name '*.dylib' -print
            exit 1
          fi
          if find "$APP" -type d -path '*/Framework' -print -quit | grep -q .; then
            echo 'Unauthorized singular Framework directory found in app bundle'
            find "$APP" -type d -path '*/Framework' -print
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry "$GITHUB_WORKSPACE/dist/nubank-preloaded-cards.ipa" Payload)
          cp -R build/nubank-preloaded-cards.xcarchive dist/
          test -s dist/nubank-preloaded-cards.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: nubank-preloaded-cards-home-patches
          path: dist/nubank-preloaded-cards.ipa
      - name: Publish IPA fallback to GitHub Release
        if: ${{ always() && hashFiles('dist/nubank-preloaded-cards.ipa') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ipa-${GITHUB_RUN_ID}"
          gh release create "$TAG" dist/nubank-preloaded-cards.ipa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "IPA Melhorawifi ${GITHUB_RUN_NUMBER}" --notes "Build experimental com perfil Melhorawifi.bpf."
