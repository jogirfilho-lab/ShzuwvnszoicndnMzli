          python3 - "$PATCH_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text()
          old = 'guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode), let catalog = try? JSONDecoder().decode(RemotePatchCatalogResponse.self, from: data), catalog.valid, let descriptor = catalog.patches?.first(where: { $0.fileName.precomposedStringWithCanonicalMapping == patch.fileName.precomposedStringWithCanonicalMapping }), let url = URL(string: descriptor.downloadUrl) else { return cachedFile(named: patch.fileName) }'
          new = '''guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode), let catalog = try? JSONDecoder().decode(RemotePatchCatalogResponse.self, from: data), catalog.valid else { return cachedFile(named: patch.fileName) }
                      guard let descriptor = catalog.patches?.first(where: { $0.fileName.precomposedStringWithCanonicalMapping == patch.fileName.precomposedStringWithCanonicalMapping }), let url = URL(string: descriptor.downloadUrl) else {
                          if let cached = cachedFile(named: patch.fileName) { try? FileManager.default.removeItem(at: cached) }
