          grep -R -q 'tema somente preto/vermelho' /dev/null 2>/dev/null || true
      - name: Add Texturas tab using authenticated external catalog
        shell: bash
        run: |
          set -euo pipefail
          PATCH_SWIFT=source/3105-1.1.1/ThreeOneOSFive/views/PatchProjectsView.swift
          python3 - "$PATCH_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          t = p.read_text()
          required = 'struct ExternalPanelView: View {'
          if required not in t:
              raise SystemExit('ExternalPanelView não encontrado; Texturas não será injetada')
          t, count = t.replace('case tools = "Extras/Ferramentas"\n        case profile', 'case tools = "Extras/Ferramentas"\n        case textures = "Texturas"\n        case profile', 1), 0
          # The replacement above is deliberately checked below; no duplicate case is allowed.
          if 'case textures = "Texturas"' not in t:
              raise SystemExit('categoria Texturas não foi adicionada')
          t = t.replace('case .tools: return "wrench.and.screwdriver.fill"\n            case .profile:', 'case .tools: return "wrench.and.screwdriver.fill"\n            case .textures: return "square.3.layers.3d.fill"\n            case .profile:', 1)
          t = t.replace('case .tools: return ["GERAL", "OUTROS", "EXTRAS/FERRAMENTAS", "EXTRAS", "FERRAMENTAS", "TOOLS"]\n            case .profile:', 'case .tools: return ["GERAL", "OUTROS", "EXTRAS/FERRAMENTAS", "EXTRAS", "FERRAMENTAS", "TOOLS"]\n            case .textures: return ["TEXTURAS", "TEXTURE", "TEXTURES", "SKINS"]\n            case .profile:', 1)
          t = t.replace('case .tools: return "Extras/Tools"\n        case .profile:', 'case .tools: return "Extras/Tools"\n        case .textures: return "Textures"\n        case .profile:', 1)
          t = t.replace('Image(systemName: category.icon).font(.system(size: 16, weight: .semibold)).foregroundStyle(accent).frame(width: 28, height: 28)', 'Image(systemName: category == .textures ? "square.3.layers.3d.fill" : category.icon).font(.system(size: 16, weight: .semibold)).foregroundStyle(accent).frame(width: 28, height: 28)', 1)
          p.write_text(t)
          # This tab intentionally reuses the existing authenticated catalog and
          # .3105 verification/apply path; no fake preview URL or unsupported action is added.
          checks = [
              'case textures = "Texturas"',
              'case .textures: return ["TEXTURAS", "TEXTURE", "TEXTURES", "SKINS"]',
              'square.3.layers.3d.fill',
              'ExternalPanelView'
          ]
          final = p.read_text()
          missing = [item for item in checks if item not in final]
          if missing:
              raise SystemExit('Texturas incompleta: ' + ', '.join(missing))
          print('Texturas adicionada: catálogo autenticado, filtragem por interfaceTab e aplicação .3105 reutilizada')
          PY
          grep -q 'case textures = "Texturas"' "$PATCH_SWIFT"
          grep -q 'TEXTURAS' "$PATCH_SWIFT"
          grep -q 'square.3.layers.3d.fill' "$PATCH_SWIFT"
      - name: Expose Texturas as main navigation tab
        shell: bash
        run: |
          set -euo pipefail
          NAV=source/3105-1.1.1/ThreeOneOSFive/helpers/AppTabNavigationState.swift
          CONTENT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          PANEL=source/3105-1.1.1/ThreeOneOSFive/views/PatchProjectsView.swift
          python3 - "$NAV" "$CONTENT" "$PANEL" <<'PY'
          from pathlib import Path
          import sys
          nav, content, panel = map(Path, sys.argv[1:])
          n = nav.read_text()
          if '    case textures\n' not in n:
              n = n.replace('    case external\n', '    case external\n    case textures\n', 1)
          n = n.replace('[.patches, .external].filter(isVisible)', '[.patches, .external, .textures].filter(isVisible)')
          nav.write_text(n)
          c = content.read_text()
          if 'sectionContent(.textures)' not in c:
              lines = c.splitlines(True)
              start = next((i for i, line in enumerate(lines) if 'sectionContent(.external)' in line), -1)
              end = next((i for i in range(start, len(lines)) if 'AppSection.external.rawValue' in lines[i]), -1) if start >= 0 else -1
              if start < 0 or end < 0:
                  raise SystemExit('compact External tab not found')
              addition = '              sectionContent(.textures)\n                  .tabItem { CompactTabLabel(title: "Texturas", systemImage: "square.3.layers.3d.fill") }\n                  .tag(AppSection.textures.rawValue)\n'
              c = ''.join(lines[:end + 1]) + addition + ''.join(lines[end + 1:])
          if 'case .textures:' not in c:
              old = '        case .external:\n            ExternalPanelView()'
              new = old + '\n        case .textures:\n            ExternalPanelView(initialCategory: "Texturas", texturesOnly: true)'
              if old not in c:
                  raise SystemExit('External section switch not found')
              c = c.replace(old, new, 1)
          c = c.replace('[.patches, .external].filter(isVisible)', '[.patches, .external, .textures].filter(isVisible)')
          c = c.replace('ForEach([AppSection.patches, .external])', 'ForEach([AppSection.patches, .external, .textures])')
          c = c.replace('case .external: return "External"\n', 'case .external: return "External"\n        case .textures: return "Texturas"\n', 1)
          c = c.replace('case .external: return "gamecontroller.fill"\n', 'case .external: return "gamecontroller.fill"\n        case .textures: return "square.3.layers.3d.fill"\n', 1)
          content.write_text(c)
          p = panel.read_text()
          if 'init(initialCategory: String = "Funções", texturesOnly: Bool = false)' not in p:
              marker = '    @Environment(\\.dismiss) private var dismiss\n'
              init_code = '    private let texturesOnly: Bool\n\n    init(initialCategory: String = "Funções", texturesOnly: Bool = false) {\n        self.texturesOnly = texturesOnly\n        _category = State(initialValue: Category(rawValue: initialCategory) ?? .functions)\n    }\n\n'
              if marker not in p:
                  raise SystemExit('ExternalPanelView init marker not found')
              p = p.replace(marker, init_code + marker, 1)
          panel.write_text(p)
          combined = nav.read_text() + content.read_text() + panel.read_text()
          for item in ('case textures', 'sectionContent(.textures)', 'AppSection.textures.rawValue', 'init(initialCategory: String = "Funções", texturesOnly: Bool = false)'):
              if item not in combined:
                  raise SystemExit('missing main Texturas marker: ' + item)
          print('main Texturas tab added')
          PY
          grep -q 'case textures' "$NAV"
          grep -q 'sectionContent(.textures)' "$CONTENT"
          grep -q 'AppSection.textures.rawValue' "$CONTENT"
          grep -q 'init(initialCategory: String = "Funções", texturesOnly: Bool = false)' "$PANEL"
      - name: Apply dedicated Texturas visual design
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/apply_texturas_design.py
          python3 /tmp/apply_texturas_design.py source/3105-1.1.1/ThreeOneOSFive/views/PatchProjectsView.swift
          grep -q "textureMainContent" source/3105-1.1.1/ThreeOneOSFive/views/PatchProjectsView.swift
          grep -q "textureOptionCard" source/3105-1.1.1/ThreeOneOSFive/views/PatchProjectsView.swift
