          }
          for path in app.rglob('*.swift'):
              text = path.read_text()
              for raw, encoded in urls.items():
                  text = text.replace(f'URL(string: "{raw}")!', f'URL(string: String(data: Data(base64Encoded: "{encoded}")!, encoding: .utf8)!)!')
                  text = text.replace(f'URL(string: "{raw}")', f'URL(string: String(data: Data(base64Encoded: "{encoded}")!, encoding: .utf8)!)')
              path.write_text(text)
          PY
          python3 - "$APP_DIR/App.swift" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          t = p.read_text()
          if 'AntiTamperGuard.start()' not in t:
              marker = '    init() {\n'
              if marker not in t:
                  raise SystemExit('App init anchor not found for anti-tamper call')
              t = t.replace(marker, marker + '        AntiTamperGuard.start()\n', 1)
