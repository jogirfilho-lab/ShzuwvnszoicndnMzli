name: Build IPA connected to Railway API



on:

  workflow_dispatch:
  
  push:
  
    branches: [main]
    


permissions:

  contents: read
  


jobs:

  build:
  
    runs-on: macos-latest
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        


      - name: Extract iOS project
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          rm -rf source dist build
          
          mkdir -p source dist build
          
          tar -xzf 3105-1.1.1-original.tar.gz -C source
          


      - name: Connect client to Railway API
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          python3 - <<'PY'
          
          from pathlib import Path
          
          import base64
          
          root = Path('source')
          
          current = 'https://knzgen.up.railway.app'
          
          old_domains = ['https://api-production-182c.up.railway.app', 'https://api-key-external.up.railway.app']
          
          for path in root.rglob('*.swift'):
          
              text = path.read_text()
              
              for old in old_domains:
              
                  text = text.replace(old, current)
                  
                  for endpoint in ['/api/license/validate', '/api/patches/catalog', '/api/patches/external/catalog', '/api/announcement']:
                  
                      old_b64 = base64.b64encode((old + endpoint).encode()).decode()
                      
                      new_b64 = base64.b64encode((current + endpoint).encode()).decode()
                      
                      text = text.replace(old_b64, new_b64)
                      
              path.write_text(text)
              
          PY
          
          if grep -R -nE 'api-production-182c|api-key-external' source --include='*.swift'; then
          
            echo 'Legacy API URL remained in the iOS sources' >&2
            
            exit 1
            
          fi
          


      - name: Build and package IPA
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          PROJECT=$(find source -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit)
          
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/ThreeOneOSFive.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION=2026.10.07 CURRENT_PROJECT_VERSION=20261007
          
          APP=$(find build/ThreeOneOSFive.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          
          test -n "$APP"
          
          mkdir -p build/Payload
          
          cp -R "$APP" build/Payload/
          
          (cd build && zip -qry "$GITHUB_WORKSPACE/dist/ThreeOneOSFive.ipa" Payload)
          
          test -s dist/ThreeOneOSFive.ipa
          


      - name: Upload IPA artifact
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: ThreeOneOSFive-IPA
          
          path: dist/ThreeOneOSFive.ipa
          


























































