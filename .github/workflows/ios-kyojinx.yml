          grep -q 'EXTERNAL CHZ' source/3105-1.1.1/ThreeOneOSFive/views/RepositoryHomeView.swift
          grep -q 'CONFIGURAÇÕES' source/3105-1.1.1/ThreeOneOSFive/views/SettingsView.swift
          grep -q 'UIColor(red: 0.92, green: 0.06, blue: 0.10' source/3105-1.1.1/ThreeOneOSFive/views/DesignSystem.swift
          grep -q 'EXTERNAL CHZ' source/3105-1.1.1/ThreeOneOSFive/App.swift
