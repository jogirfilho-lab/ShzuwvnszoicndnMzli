              raise SystemExit("Cliente Swift da API não foi incluído")
          if "X-PH-IOS-Token" not in text:
              raise SystemExit("Header X-PH-IOS-Token não foi injetado")
          for legacy in ("api-key-external.up.railway.app", "api-production-182c.up.railway.app"):
              if legacy in text:
